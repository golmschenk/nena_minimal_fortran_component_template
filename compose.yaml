services:
  component_pipeline:
    build:
      context: .
      dockerfile: Containerfile
    image: docker.io/golmschenk/nena_minimal_fortran_component_template:1.0.0
    working_dir: /workspace
    environment:
      NENA_IN_EVENT_PIPELINE: "false"
    volumes:
      - ./input_events:/workspace/input_events:ro
      - ./output_events:/workspace/output_events
